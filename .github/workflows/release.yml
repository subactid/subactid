name: release
on:
  push:
    tags: ['v*']

# Runs only on a pushed v* tag. The tag decides what is published.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled, so a run cannot leave a signed image without its chart.
  cancel-in-progress: false

jobs:
  # The whole of CI, on the tagged commit: build, tests, conformance, the image, the quickstart,
  # the chart and Keycloak. Nothing is published unless every job passes.
  ci:
    if: github.repository == 'subactid/subactid'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write # the image job's vulnerability report

  release:
    needs: ci
    # Forks do not publish.
    if: github.repository == 'subactid/subactid'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Pauses, once ci has passed, until a reviewer approves the release environment. The approval
    # is recorded on the run.
    environment:
      name: release
      url: https://github.com/subactid/subactid/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # the GitHub release and its attached chart
      packages: write # the image and the chart on GHCR
      id-token: write # OIDC identity for keyless cosign signing and the attestation
      attestations: write # the build provenance attestation
      security-events: write # the vulnerability reports
    env:
      IMAGE: ghcr.io/subactid/subactid
      CHART_REGISTRY: ghcr.io/subactid/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the changelog can find the previous tag.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        shell: bash
        run: |
          set -euo pipefail
          # The tag ruleset limits who may tag. This limits what: only a commit that went through
          # review and is on main is released, wherever the tag points.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Tag is not on main::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from main. Only reviewed commits are released."
            exit 1
          fi
          echo "$GITHUB_REF_NAME points at a commit on main"

      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Not a release tag::'$tag' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi
          # A prerelease gets only its own version tag, never ":latest" or major.minor.
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          tags="${IMAGE}:${version}"
          if [ "$prerelease" = false ]; then
            tags="${tags}"$'\n'"${IMAGE}:${version%.*}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "tags<<TAGS"
            echo "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $version from $tag"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is built once, into a registry on this runner. It is run and scanned from there,
      # and only then copied to GHCR, so the digest signed below is the digest that was checked.
      - name: Start the registry the image is checked in
        run: docker run -d --name candidates -p 127.0.0.1:5000:5000 "$(.github/scripts/tool-image.sh registry)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # On the host network, so the builder can push to the registry above, over plain http
          # since it is on this machine.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      # The image is cross-compiled, so building arm64 needs no emulation, but running it does.
      - name: Let this runner run arm64 images
        run: docker run --rm --privileged "$(.github/scripts/tool-image.sh binfmt)" --install arm64

      - name: Refuse to publish over something already published
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A version is published once. A re-run for an already published tag stops here.
          published() {
            local ref="$1" out
            if out=$(docker buildx imagetools inspect --raw "$ref" 2>&1); then
              return 0
            fi
            case "$out" in
              # Missing or unreadable. On GHCR write access implies read access, so nothing of ours is there.
              *"not found"*|*"manifest unknown"*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*|*denied*|*"401 Unauthorized"*|*"403 Forbidden"*)
                return 1 ;;
              # Any other error means the registry did not answer, so fail.
              *)
                echo "::error title=Registry did not answer::could not tell whether $ref is published: $out"
                exit 1 ;;
            esac
          }
          for ref in "${IMAGE}:${VERSION}" "${CHART_REGISTRY}/subactid:${VERSION}"; do
            if published "$ref"; then
              echo "::error title=Already published::$ref is published. Cut a new version rather than replacing it."
              exit 1
            fi
            echo "$ref is free"
          done

      - name: Build the image to check
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The production image. Quickstart images are never pushed.
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # SBOM and build provenance, attached as in-toto attestations. They travel with the
          # image when it is copied to GHCR.
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: localhost:5000/subactid:candidate

      - name: Run each platform
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          index="localhost:5000/subactid@${DIGEST}"
          for arch in amd64 arm64; do
            # The index holds one manifest per platform, plus the attestations. Docker's image store cannot
            # keep two platforms under the index digest, so each platform is pulled by its own digest.
            manifest=$(docker buildx imagetools inspect "$index" --raw \
              | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            if [ -z "$manifest" ]; then
              echo "::error title=No linux/${arch} image::the index ${DIGEST} has no manifest for linux/${arch}."
              exit 1
            fi
            image="localhost:5000/subactid@${manifest}"
            machine=$(docker run --rm --platform "linux/${arch}" --entrypoint uname "$image" -m)
            case "${arch}:${machine}" in
              amd64:x86_64|arm64:aarch64) ;;
              *)
                echo "::error title=Wrong architecture::the linux/${arch} image runs as ${machine}."
                exit 1 ;;
            esac
            # "agent init" needs no configuration, database or identity provider, and starts the runtime.
            docker run --rm --platform "linux/${arch}" "$image" agent init release-smoke --out /tmp
            echo "linux/${arch} is ${manifest} and runs on ${machine}"
          done

      - name: Report each platform's known vulnerabilities
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            TRIVY_PLATFORM="linux/${arch}" .github/scripts/scan-image.sh report "localhost:5000/subactid@${DIGEST}" "trivy-${arch}.sarif"
          done

      - name: Publish the amd64 report to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-amd64.sarif
          category: release-image-amd64

      - name: Publish the arm64 report to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-arm64.sarif
          category: release-image-arm64

      - name: Fail on a high or critical vulnerability that has a fix
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            TRIVY_PLATFORM="linux/${arch}" .github/scripts/scan-image.sh gate "localhost:5000/subactid@${DIGEST}"
          done

      - name: Publish the checked image
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          set -euo pipefail
          # Copies the index, both platforms and their attestations as they are. Nothing is rebuilt.
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "localhost:5000/subactid@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            published=$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')
            if [ "$published" != "$DIGEST" ]; then
              echo "::error title=Published image is not the checked one::$tag is $published, the image that was run and scanned is $DIGEST."
              exit 1
            fi
            echo "$tag is $DIGEST"
          done <<< "$TAGS"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # Keyless signing with the workflow's OIDC identity. Signs the digest, not a tag.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # GitHub's own build provenance for the same digest, stored next to the image on GHCR, so
      # `gh attestation verify` works as well as cosign.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Stamp the chart with the tag, and check it names the image this run pushed
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          chart=deploy/helm/subactid/Chart.yaml
          sed -i -E "s|^version: .*|version: ${VERSION}|" "$chart"
          sed -i -E "s|^appVersion: .*|appVersion: \"${VERSION}\"|" "$chart"
          grep -qxF "version: ${VERSION}" "$chart" && grep -qxF "appVersion: \"${VERSION}\"" "$chart" || {
            echo "::error title=Chart not stamped::Chart.yaml did not take the version from the tag."
            exit 1
          }

          # The chart must resolve to the image digest this run pushed.
          rendered=$(helm template subactid deploy/helm/subactid \
            --set issuer=https://subactid.example.invalid \
            --set upstream.issuer=https://idp.example.invalid/realms/subactid \
            --set database.existingSecret=subactid-db \
            --set signing.existingSecret=subactid-signing \
            --show-only templates/deployment.yaml)
          if ! printf '%s' "$rendered" | grep -qF "image: \"${IMAGE}:${VERSION}\""; then
            echo "::error title=Chart does not name this release::the chart does not resolve to ${IMAGE}:${VERSION}."
            printf '%s\n' "$rendered" | grep -F 'image:' || true
            exit 1
          fi
          resolved=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')
          if [ "$resolved" != "$DIGEST" ]; then
            echo "::error title=Chart names an image this run did not push::${IMAGE}:${VERSION} is $resolved, this run pushed $DIGEST."
            exit 1
          fi
          echo "the chart installs ${IMAGE}:${VERSION} at ${DIGEST}"

      - name: Package, push and sign the chart
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package deploy/helm/subactid --destination "$RUNNER_TEMP"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/subactid-${VERSION}.tgz" "oci://${CHART_REGISTRY}" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | head -n1 || true)
          if [ -z "$digest" ]; then
            echo "::error title=Chart push said nothing::helm push did not report a digest, so there is nothing to sign."
            exit 1
          fi
          cosign sign --yes "${CHART_REGISTRY}/subactid@${digest}"
          echo "pushed and signed ${CHART_REGISTRY}/subactid:${VERSION} at ${digest}"

      - name: Sign the chart archive that goes on the release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The archive that was just pushed, signed as a blob with the same identity. Its bundle is
          # attached to the release next to it: OpenSSF Scorecard's Signed-Releases check reads
          # release assets only, so the signatures on GHCR do not count there, and ".sigstore.json"
          # is one of the suffixes it accepts.
          archive="$RUNNER_TEMP/subactid-${VERSION}.tgz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          echo "signed ${archive##*/}, bundle in ${archive##*/}.sigstore.json"

      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..${tag}"
            since="Changes since ${previous}"
          else
            range="$tag"
            since="Changes"
          fi
          subjects=$(git log --no-merges --pretty=format:'%s' "$range" | grep -v '^$' || true)

          # One section per conventional-commit type, with the type stripped off the subject.
          section() {
            local heading="$1" types="$2" body
            body=$(printf '%s\n' "$subjects" | sed -n -E "s/^(${types})(\([^)]*\))?!?: /- /p" || true)
            [ -n "$body" ] || return 0
            printf '\n### %s\n\n%s\n' "$heading" "$body"
          }

          {
            printf '## %s\n' "$since"
            # Breaking changes get their own section.
            breaking=$(printf '%s\n' "$subjects" | sed -n -E 's/^[a-z]+(\([^)]*\))?!: /- /p' || true)
            if [ -n "$breaking" ]; then printf '\n### Breaking\n\n%s\n' "$breaking"; fi
            section 'Added' 'feat'
            section 'Fixed' 'fix'
            section 'Documentation' 'docs'
            # All other commit types go here, with the type stripped.
            other=$(printf '%s\n' "$subjects" \
              | grep -vE '^(feat|fix|docs)(\([^)]*\))?!?: ' | grep -v '^$' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^/- /' || true)
            if [ -n "$other" ]; then printf '\n### Everything else\n\n%s\n' "$other"; fi

            cat <<NOTES

          ## Artefacts

          | | |
          |---|---|
          | Image | \`${IMAGE}:${VERSION}\` (\`${DIGEST}\`), linux/amd64 and linux/arm64 |
          | Chart | \`oci://${CHART_REGISTRY}/subactid\`, version \`${VERSION}\` |
          | Chart archive | \`subactid-${VERSION}.tgz\` below, with its cosign bundle \`subactid-${VERSION}.tgz.sigstore.json\` |

          All three are signed keylessly with cosign against this workflow's identity on a release
          tag, so a signature from any other run of it does not verify. The image carries its SBOM
          and build provenance as attestations, and a GitHub build provenance attestation.

          \`\`\`sh
          cosign verify ${IMAGE}:${VERSION} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp '^https://github.com/subactid/subactid/\.github/workflows/release\.yml@refs/tags/v'

          cosign verify ${CHART_REGISTRY}/subactid:${VERSION} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp '^https://github.com/subactid/subactid/\.github/workflows/release\.yml@refs/tags/v'

          cosign verify-blob subactid-${VERSION}.tgz \\
            --bundle subactid-${VERSION}.tgz.sigstore.json \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp '^https://github.com/subactid/subactid/\.github/workflows/release\.yml@refs/tags/v'

          docker buildx imagetools inspect ${IMAGE}:${VERSION} --format '{{ json .SBOM }}'

          gh attestation verify oci://${IMAGE}:${VERSION} --owner subactid
          \`\`\`
          NOTES
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        shell: bash
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          # Fails if the release already exists. The assets are the chart archive and its cosign bundle.
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            "$RUNNER_TEMP/subactid-${VERSION}.tgz" "$RUNNER_TEMP/subactid-${VERSION}.tgz.sigstore.json"
