name: image-scan
on:
  # Weekly, because new vulnerabilities are published against images that have not changed.
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    # Forks have no published image.
    if: github.repository == 'subactid/subactid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # the image's build provenance, which gh attestation verify reads
      security-events: write # the vulnerability reports
    env:
      IMAGE: ghcr.io/subactid/subactid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release GitHub marks as latest, which is never a draft or a prerelease. What it
          # published is what gets checked and scanned, not whatever "latest" on GHCR points at.
          if ! tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name); then
            echo "::error title=No stable release::the repository has no release marked latest, so there is nothing to check."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "the latest stable release is $tag"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A failure here means GHCR no longer serves what the release signed, because a tag moved
      # or an artefact was replaced, and the log names which. Nothing is scanned until that is
      # understood.
      - name: Check that GHCR serves what the release signed
        id: published
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-published.sh "$VERSION"

      - name: Report its known vulnerabilities that have a fix
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: .github/scripts/scan-image.sh report "${IMAGE}@${DIGEST}" trivy.sarif

      - name: Publish the report to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: published-image

      # Nothing can act on a finding with no fix, so these fail nothing. They are on record under
      # their own category rather than nowhere.
      - name: Report its known vulnerabilities that have no fix
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: .github/scripts/scan-image.sh report-unfixed "${IMAGE}@${DIGEST}" trivy-unfixed.sarif

      - name: Publish that report to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-unfixed.sarif
          category: published-image-unfixed

      # A failure here means the latest release ships a fixable high or critical vulnerability:
      # rebuild on the patched base image and cut a patch release.
      - name: Fail on a high or critical vulnerability that has a fix
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: .github/scripts/scan-image.sh gate "${IMAGE}@${DIGEST}"
