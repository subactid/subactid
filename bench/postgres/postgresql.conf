# Postgres configuration for the sizing rig, as reported in docs/sizing.md.
#
# Sized for a 2 GiB container sharing four vCPUs with the rest of the rig. A starting point for
# a small deployment, not a tuning guide.

# initdb writes these into PGDATA. With config_file outside PGDATA, Postgres would look beside it.
# This is the image's PGDATA for Postgres 18, and moves with the major version.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

listen_addresses = '*'
port = 5432

# The Npgsql pool bounds the connection count. A lower ceiling leaves more memory for buffers.
max_connections = 200

# A quarter of the container's memory, the usual starting point.
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 256MB
work_mem = 8MB

# Durability stays on: an audit record must be on disk when the commit returns.
synchronous_commit = on
wal_level = replica
wal_buffers = 16MB
wal_compression = on

# Spread checkpoints out, as docs/sizing.md recommends, to avoid latency spikes.
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Costs for local NVMe, not the spinning-disk defaults.
random_page_cost = 1.1
effective_io_concurrency = 200

# Used by statements.sh to count statements per request.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
track_io_timing = on

# The ledger only grows and the task tables churn.
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# No statement log, so logging does not add load.
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_duration_statement = -1
log_checkpoints = on
log_line_prefix = '%m [%p] '

timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
