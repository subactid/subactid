# The sizing rig behind docs/sizing.md: the release image of the control plane, Postgres,
# Keycloak and the load generator, each in its own container.
#
#   - The image is built from the repository's Dockerfile.
#   - Migrations run with the explicit `migrate` command before the server starts.
#   - ASPNETCORE_ENVIRONMENT is Production, so a missing signing key stops startup.
#   - The signing key and admin API key are generated by `./rig.sh up`, not stored here.
#   - The rate limiter is on, with its limit raised above the offered load.
#     SUBACTID_RATELIMIT_ENABLED=false is for measuring the limiter's cost.
#   - Postgres uses postgres/postgresql.conf.
#   - The sponsor check is in `poll` mode, so every exchange calls Keycloak's admin API.
#
# No TLS: everything uses http on a private bridge network, as behind a TLS-terminating ingress.
#
# Ports are published only on RIG_BIND (loopback by default). For a remote generator, set it
# with RIG_ADDRESS to an address on a trusted network. The admin credentials must not be public.

name: subactid-bench

x-subactid-environment: &subactid-environment
  # Must be the address clients use, since client assertion `aud` must match it. RIG_ADDRESS sets it.
  SubactId__Issuer: http://${RIG_ADDRESS:-subactid}:5100
  # The rig runs over plain http on its own network. Never set this in production.
  SubactId__AllowInsecureHttp: "true"
  SubactId__UpstreamIdp__Issuer: http://keycloak:8080/realms/subactid-bench
  SubactId__UpstreamIdp__Audience: subactid
  SubactId__UpstreamIdp__SponsorCheck__UsersUrl: http://keycloak:8080/admin/realms/subactid-bench/users
  SubactId__UpstreamIdp__SponsorCheck__TokenUrl: http://keycloak:8080/realms/subactid-bench/protocol/openid-connect/token
  SubactId__UpstreamIdp__SponsorCheck__ClientId: subactid
  SubactId__Database__ConnectionString: Host=postgres;Port=5432;Database=subactid;Username=subactid;Password=${POSTGRES_PASSWORD:?set by rig.sh};Maximum Pool Size=${SUBACTID_DB_POOL:-100}
  SubactId__Signing__Keys__0__Path: /etc/subactid/signing-key.pem
  SubactId__Admin__ApiKey: ${SUBACTID_ADMIN_API_KEY:?set by rig.sh}
  SubactId__Audit__Checkpoint__Interval: ${SUBACTID_CHECKPOINT_INTERVAL:-PT1M}
  SubactId__Audit__Aggregation__Enabled: ${SUBACTID_AGGREGATION_ENABLED:-true}
  SubactId__RateLimit__Enabled: ${SUBACTID_RATELIMIT_ENABLED:-true}
  SubactId__RateLimit__PermitsPerMinute: ${SUBACTID_RATELIMIT_PERMITS:-120000}
  SubactId__RateLimit__Burst: ${SUBACTID_RATELIMIT_BURST:-4000}
  ASPNETCORE_ENVIRONMENT: Production
  # Server GC is the default. Set to 0 to measure Workstation GC.
  DOTNET_gcServer: ${DOTNET_GCSERVER:-1}

services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: subactid
      # The bootstrap superuser, used only by initdb. The control plane connects as the
      # ordinary role `subactid`, since a superuser bypasses the ledger's REVOKE guard.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set by rig.sh}
      SUBACTID_DB_PASSWORD: ${POSTGRES_PASSWORD:?set by rig.sh}
    volumes:
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      # From 18 the image keeps its data in a versioned directory under this one.
      - postgres:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subactid -d subactid"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The identity provider, in development mode with an in-memory database, so no second
  # database competes for the rig's cores.
  keycloak:
    build:
      context: ./keycloak
    image: subactid-bench/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set by rig.sh}
      KC_HEALTH_ENABLED: "true"
      # Fixed hostname, so tokens carry the issuer the control plane trusts however the
      # generator connects.
      KC_HOSTNAME: http://keycloak:8080
      JAVA_OPTS_KC_HEAP: -Xms512m -Xmx1024m
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-2g}
    ports:
      # For a remote generator to sign users in. RIG_BIND defaults to loopback.
      - "${RIG_BIND:-127.0.0.1}:8080:8080"

  # Runs migrations once with "migrate", as the chart's hook Job does.
  subactid-migrate:
    image: ${SUBACTID_IMAGE:-subactid-bench/control-plane:local}
    command: ["migrate"]
    environment: *subactid-environment
    volumes:
      - ./.secrets/signing-key.pem:/etc/subactid/signing-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  subactid:
    image: ${SUBACTID_IMAGE:-subactid-bench/control-plane:local}
    environment: *subactid-environment
    volumes:
      - ./.secrets/signing-key.pem:/etc/subactid/signing-key.pem:ro
    mem_limit: ${SUBACTID_MEM_LIMIT:-1g}
    depends_on:
      subactid-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      # For inspection and for a remote generator. A local generator uses the bridge network.
      - "${RIG_BIND:-127.0.0.1}:5100:5100"

  # The load generator. Run on demand through ./bench.sh, locally or on BENCH_DOCKER_HOST.
  bench:
    build:
      context: ..
      dockerfile: bench/SubactId.Bench/Dockerfile
    image: subactid-bench/load-generator:local
    environment:
      SUBACTID_ISSUER: http://${RIG_ADDRESS:-subactid}:5100
      SUBACTID_ADMIN_API_KEY: ${SUBACTID_ADMIN_API_KEY:?set by rig.sh}
      KEYCLOAK_URL: http://${RIG_ADDRESS:-keycloak}:8080
      KEYCLOAK_REALM: subactid-bench
      KEYCLOAK_CLIENT_ID: bench-cli
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set by rig.sh}
    volumes:
      - ./results:/results
    mem_limit: ${BENCH_MEM_LIMIT:-1g}
    profiles: ["tools"]
    depends_on:
      subactid:
        condition: service_started

volumes:
  postgres:
