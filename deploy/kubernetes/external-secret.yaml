# Example: project the chart's Secrets from a secret manager with the External Secrets
# Operator, so no private key is ever in a manifest, values file or repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: subactid-signing
  namespace: subactid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: subactid-signing
    creationPolicy: Owner
  data:
    # Must match signing.keys[].key in the chart values.
    - secretKey: 2026-09.pem
      remoteRef:
        key: secret/data/subactid/signing
        property: 2026-09.pem
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: subactid-db
  namespace: subactid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: subactid-db
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: secret/data/subactid/database
        property: connection-string
---
# The role that may change the schema, for database.migration.existingSecret. Only the migrate
# job reads it, never the server.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: subactid-db-migrate
  namespace: subactid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: subactid-db-migrate
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: secret/data/subactid/database-migrate
        property: connection-string
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: subactid-admin
  namespace: subactid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: subactid-admin
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: secret/data/subactid/admin
        property: api-key
