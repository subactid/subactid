# Postgres and Keycloak for a kind cluster. For kind only: all credentials are throwaway and
# neither service keeps data past the pod.
apiVersion: v1
kind: Namespace
metadata:
  name: subactid
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: subactid
data:
  # Run once by the image, as its bootstrap superuser, when it creates the data directory.
  init.sql: |
    -- The role the migrate Job and the server run as. It owns the database, so it can apply the
    -- schema and create the ledger's partitions, and it is not a superuser: Postgres answers every
    -- privilege check with yes for a superuser, so the UPDATE, DELETE and TRUNCATE the schema
    -- revokes on the ledger would never read as revoked, and doctor's audit-partitions check
    -- would fail on a guard that is in place.
    CREATE ROLE subactid LOGIN PASSWORD 'kind-only';
    ALTER DATABASE subactid OWNER TO subactid;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: subactid
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: subactid
            # The image's bootstrap account is a superuser. Nothing of Subact ID connects as it; the
            # server and the migrate Job use the role init.sql creates.
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: kind-only
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "subactid", "-d", "subactid"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            # From 18 the image keeps its data in a versioned directory under this one.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: subactid
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: subactid
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
          args: ["start-dev"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: kind-only
            - name: KC_HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master/.well-known/openid-configuration
              port: 8080
            periodSeconds: 3
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: subactid
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 80
      targetPort: 8080
