{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "subactid.serviceAccountName" . }}
  labels:
    {{- include "subactid.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Subact ID calls no Kubernetes API, so the token is not mounted.
automountServiceAccountToken: false
{{- end }}
